// ============================================================
// LAW EMPIRE: SIERRA LEONE — app/build.gradle  (v2.0)
// Requires Android Studio Hedgehog (2023.1.1+) or newer
// compileSdk 34 · minSdk 24 · targetSdk 34
// ============================================================

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'                     // Room annotation processing
    id 'kotlin-parcelize'                // Parcelable support
}

android {
    namespace 'com.lawempire.sierraleone'
    compileSdk 34

    defaultConfig {
        applicationId "com.lawempire.sierraleone"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "2.1.0-DEMO"

        buildConfigField "String", "GIFT_CODE_SALT",    '"LE_SL_2024_SALT_XK9"'
        buildConfigField "String", "BASE_URL",          '"https://api.lawempire.xyz/v1/"'
        buildConfigField "String", "PLAY_BILLING_KEY",  '"YOUR_BASE64_ENCODED_RSA_PUBLIC_KEY"'
        buildConfigField "String", "APP_DOMAIN",        '"lawempire.xyz"'

        buildConfigField "Boolean", "IS_DEMO_VERSION",  "true"
        buildConfigField "String",  "DEMO_EXPIRY",       '"2025-12-31"'

        // ── Monime payment gateway ──────────────────────────────────
        // Set MONIME_SPACE_ID in your CI/CD environment — never hardcode
        // Get your Space ID from: dashboard.monime.io → Settings → Space Details
        // Format: spc-xxxx
        buildConfigField "String", "MONIME_SPACE_ID",    '"YOUR_MONIME_SPACE_ID"'
        // Monime API version (current stable)
        buildConfigField "String", "MONIME_API_VERSION", '"caph.2025-08-23"'
        // App deep-link scheme for Monime return URLs
        buildConfigField "String", "MONIME_SUCCESS_URL", '"lawempire://payment/success"'
        buildConfigField "String", "MONIME_CANCEL_URL",  '"lawempire://payment/cancel"'
        // NOTE: Monime Bearer token must NEVER be in the APK.
        // The APK calls api.lawempire.xyz which holds the token server-side.

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Room schema export directory
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas"]
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            debuggable true
            buildConfigField "Boolean", "ENABLE_GIFT_CODES", "true"
            buildConfigField "Boolean", "SANDBOX_BILLING",   "true"
            buildConfigField "String",  "ANALYTICS_KEY",     '"debug_key"'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "Boolean", "ENABLE_GIFT_CODES", "true"
            buildConfigField "Boolean", "SANDBOX_BILLING",   "false"
            buildConfigField "String",  "ANALYTICS_KEY",     '"REPLACE_WITH_REAL_KEY"'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true      // needed for BuildConfig.* fields above
        dataBinding false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ["-Xopt-in=kotlin.RequiresOptIn"]
    }

    // Split APKs by ABI for smaller download sizes
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86_64"
            universalApk true
        }
    }

    // Needed for Lottie & some billing libs
    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
            ]
        }
    }
}

dependencies {
    // ── Core AndroidX ──────────────────────────────────────
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // ── Navigation (Fragments) ─────────────────────────────
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.6'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.6'

    // ── Lifecycle & ViewModel ──────────────────────────────
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.7.0'   // AppLifecycleObserver

    // ── Room (local database — player save, gift codes) ────
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // ── DataStore (preferences) ────────────────────────────
    implementation 'androidx.datastore:datastore-preferences:1.0.0'

    // ── Coroutines ─────────────────────────────────────────
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'

    // ── JSON serialisation ─────────────────────────────────
    implementation 'com.google.code.gson:gson:2.10.1'

    // ── ─────────── AUDIO / MUSIC ─────────────────────────
    // MediaPlayer is built-in; ExoPlayer for richer music control
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'
    implementation 'androidx.media3:media3-session:1.2.1'

    // ── ─────────── HAPTIC / VIBRATION ────────────────────
    // Built into Android SDK — no extra dependency needed.
    // VibrationEffect (API 26+) and HapticFeedbackConstants used directly.

    // ── ─────────── IN-APP BILLING (Google Play) ──────────
    // Handles subscriptions, one-time purchases, dev points IAP
    implementation 'com.android.billingclient:billing-ktx:6.1.0'

    // ── ─────────── ANIMATIONS ────────────────────────────
    implementation 'com.airbnb.android:lottie:6.3.0'

    // ── ─────────── IMAGE LOADING ─────────────────────────
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    kapt 'com.github.bumptech.glide:compiler:4.16.0'

    // ── ─────────── NETWORKING (gift code validation) ──────
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // ── ─────────── SECURITY (gift code hashing) ──────────
    // java.security.MessageDigest (SHA-256) is built-in — no dep needed

    // ── ─────────── ANALYTICS (optional) ──────────────────
    // Uncomment once Firebase project is set up:
    // implementation platform('com.google.firebase:firebase-bom:32.7.0')
    // implementation 'com.google.firebase:firebase-analytics-ktx'
    // implementation 'com.google.firebase:firebase-crashlytics-ktx'

    // ── ─────────── TESTING ────────────────────────────────
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.8.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.room:room-testing:2.6.1'
}
